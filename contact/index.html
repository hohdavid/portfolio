<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>

    <h1>Contact</h1>
    <p>Feel free to reach out!</p>

    <form action="mailto:dho001@ucsd.edu" method="POST" enctype="text/plain">

            Email:
            <input type="email" name="email">

    </form>
</body>
